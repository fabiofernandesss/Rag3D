<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG3D — chat com seus documentos</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0d1117; color: #e6edf3;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 9px; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f4650; }

    /* animações */
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .fade-in { animation: fadeInUp .28s ease both; }
    @keyframes blink { 0%,45% { opacity: 1; } 50%,100% { opacity: 0; } }
    .cursor { display: inline-block; margin-left: 1px; color: #7c5cff; animation: blink 1s steps(1) infinite; font-weight: 700; }
    @keyframes bounce { 0%,80%,100% { transform: scale(.5); opacity:.4; } 40% { transform: scale(1); opacity:1; } }
    .dots i { display:inline-block; width:6px; height:6px; margin:0 2px; border-radius:50%; background:#7c5cff; animation: bounce 1.2s infinite ease-in-out; }
    .dots i:nth-child(2){ animation-delay:.15s; } .dots i:nth-child(3){ animation-delay:.3s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display:inline-block; width:15px; height:15px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation: spin .7s linear infinite; }

    /* linha de mensagem (ChatGPT-like) */
    .msg-row { display:flex; gap:14px; padding:20px 4px; border-bottom:1px solid rgba(48,54,61,.5); }
    .msg-row:last-of-type { border-bottom:0; }
    .avatar { flex:none; width:30px; height:30px; border-radius:50%; display:flex; align-items:center;
      justify-content:center; font-size:15px; box-shadow:0 1px 4px rgba(0,0,0,.35); }

    /* composer (caixa de digitação) */
    .composer { display:flex; align-items:flex-end; gap:8px; background:#161b22; border:1px solid #30363d;
      border-radius:16px; padding:10px 10px 10px 16px; transition:border-color .15s, box-shadow .15s; }
    .composer:focus-within { border-color:#7c5cff; box-shadow:0 0 0 3px rgba(124,92,255,.15); }
    .composer.busy { opacity:.85; }
    .send-btn { flex:none; width:34px; height:34px; border-radius:10px; border:0; cursor:pointer;
      background:#7c5cff; color:#fff; font-size:18px; font-weight:800; display:flex; align-items:center;
      justify-content:center; transition:transform .1s, background .15s, opacity .15s; }
    .send-btn:hover:not(:disabled) { background:#6a4bff; transform:translateY(-1px); }
    .send-btn:disabled { opacity:.4; cursor:default; }

    /* chips de sugestão */
    .chip { background:#161b22; border:1px solid #30363d; color:#e6edf3; padding:9px 14px; border-radius:999px;
      cursor:pointer; font-size:13px; transition:all .15s; }
    .chip:hover { border-color:#7c5cff; background:#1c2333; transform:translateY(-1px); }

    /* detalhes dos 3 eixos */
    .axes { margin-top:10px; }
    .axes summary { cursor:pointer; color:#8b949e; font-size:12.5px; list-style:none; user-select:none; }
    .axes summary:hover { color:#e6edf3; }

    /* markdown da resposta da IA */
    .md { line-height: 1.6; font-size: 15px; }
    .md > :first-child { margin-top: 0; }
    .md > :last-child { margin-bottom: 0; }
    .md p { margin: 8px 0; }
    .md strong { color: #fff; font-weight: 700; }
    .md h1, .md h2, .md h3 { margin: 12px 0 6px; line-height: 1.3; }
    .md h1 { font-size: 20px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; }
    .md ul, .md ol { margin: 6px 0; padding-left: 22px; }
    .md li { margin: 3px 0; }
    .md code { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
    .md pre { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 10px; overflow-x: auto; }
    .md pre code { border: 0; padding: 0; }
    .md blockquote { border-left: 3px solid #7c5cff; margin: 8px 0; padding: 2px 12px; color: #b9c0c8; }
    .md table { border-collapse: collapse; margin: 8px 0; }
    .md th, .md td { border: 1px solid #30363d; padding: 4px 8px; }
    .md a { color: #7c5cff; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/bundle.js"></script>
</body>
</html>
